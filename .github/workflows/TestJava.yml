
name: QuickChat CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build and Test QuickChat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Apache Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Check Java and Ant versions
        run: |
          java -version
          ant -version

      - name: Clean and build project
        run: ant -noinput clean jar

      - name: Run JUnit tests
        run: ant -noinput test
